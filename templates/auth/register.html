{% extends 'base.html' %}

{% block title %}Register Member Account — GYMKHANA{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 56px; height: 56px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Create Member Account</h3>
                    <p class="text-muted small">Join Gymkhana to track your workout schedules, diets, and fitness progression</p>
                </div>

                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+91 9876543210">
                        </div>
                        <div class="col-md-6">
                            <label for="gender" class="form-label fw-semibold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="date_of_birth" class="form-label fw-semibold">Date of Birth</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth">
                        </div>
                        <div class="col-md-4">
                            <label for="height" class="form-label fw-semibold">Height (cm)</label>
                            <input type="number" step="0.1" class="form-control" id="height" name="height" placeholder="e.g. 175">
                        </div>
                        <div class="col-md-4">
                            <label for="weight" class="form-label fw-semibold">Weight (kg)</label>
                            <input type="number" step="0.1" class="form-control" id="weight" name="weight" placeholder="e.g. 70.5">
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="Min. 6 characters" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-danger w-100 py-2.5 fw-bold shadow-sm">
                            <i class="bi bi-check-circle me-2"></i> Register Account
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="{{ url_for('auth.login') }}" class="text-danger fw-bold text-decoration-none small ms-1">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
