{% extends 'base.html' %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="display-1 text-danger fw-bold">404</div>
    <h3 class="fw-bold mb-3">Page Not Found</h3>
    <p class="text-secondary mb-4">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-danger px-4 fw-bold">Return to Home</a>
</div>
{% endblock %}
